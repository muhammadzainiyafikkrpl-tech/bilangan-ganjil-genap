name: Build Bilangan EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --onefile bilangan.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: bilangan-exe
        path: dist/bilangan.exe
